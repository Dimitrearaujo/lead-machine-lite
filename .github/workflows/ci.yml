name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m py_compile server.py
          python -m py_compile fcntl.py
          echo "Todos os modulos OK"

      - name: Startup test (sem chaves)
        run: |
          python -c "
          import ast, pathlib
          src = pathlib.Path('server.py').read_text()
          tree = ast.parse(src)
          print(f'server.py: {len(list(ast.walk(tree)))} nos AST analisados OK')
          "
